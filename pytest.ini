[pytest]
# Enable asyncio support
asyncio_mode = auto

# Console output configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Other configurations
xvs_output = true
addopts = --tb=auto -v --capture=no

# Markers for different test types
markers =
    fast: Quick tests that don't require extensive game interaction
    warrior: Tests for the warrior path
    mystic: Tests for the mystic path
    stealth: Tests for the stealth path
    integration: End-to-end tests that cover multiple game systems
    llm: Tests that specifically test LLM integration 