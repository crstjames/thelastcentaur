<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Last Centaur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234a3520'/%3E%3Ctext x='8' y='12.5' font-size='12' text-anchor='middle' fill='%23ffd700' font-family='monospace' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    --gold: #ffd700;
    --amber: #fbbf24;
    --amber-deep: #d97706;
    --bronze: #996633;
    --wood: #4a3520;
    --ink: #0c0a08;
    --panel: rgba(22, 17, 12, 0.9);
    --parchment: #f2e6cf;
    --dim: #a8987c;
    --danger: #c0392b;

    --woods: #2e4a2c;
    --meadow: #66683a;
    --highlands: #6c6964;
    --crystal: #3c6b74;
    --ruins: #6a4e35;
    --twilight: #4a3f5e;
    --blight: #3b3838;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #050605 url("/assets/images/bg.png") center / cover fixed no-repeat;
    image-rendering: pixelated;
    color: var(--parchment);
    font-family: "VT323", monospace;
    overflow: hidden;
  }
  body::before {           /* darken the art so text stays readable */
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), rgba(0,0,0,0.8));
    pointer-events: none;
  }

  .pixel { font-family: "Press Start 2P", monospace; }
  button {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--parchment);
    background: var(--wood);
    border: 2px solid var(--bronze);
    padding: 10px 14px;
    cursor: pointer;
    box-shadow: 0 3px 0 #1d140b;
    transition: transform 0.1s, background 0.15s;
  }
  button:hover { background: #5d4429; transform: translateY(-1px); }
  button:active { transform: translateY(2px); box-shadow: none; }
  button.primary { background: var(--amber-deep); color: #1a0f04; border-color: var(--amber); }
  button.primary:hover { background: var(--amber); }
  button.warn { border-color: var(--danger); color: #ffd2cc; }

  /* ---------- the opening: prologue crawl, then the title (which is the start screen) ---------- */
  #title {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; padding: 16px;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0.25), rgba(0,0,0,0.8)),
      #050605 url("/assets/images/bg.png") center / cover no-repeat;
    transition: opacity 0.6s;
  }
  #title.hidden { opacity: 0; pointer-events: none; }
  #title > :not(.fx) { position: relative; z-index: 3; }
  /* Weather: rain and lightning are drawn at half resolution for chunky pixels. */
  #title .fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  #title canvas.fx { image-rendering: pixelated; }
  #title #bolt { opacity: 0; }
  #title .flash {
    opacity: 0;
    background: radial-gradient(ellipse at 50% 15%, rgba(225, 245, 255, 0.85), rgba(150, 195, 225, 0.45) 55%, rgba(90, 130, 170, 0.25));
    mix-blend-mode: screen;
  }
  #title .strike {
    opacity: 0; z-index: 4;
    background: radial-gradient(ellipse at 50% 45%, #fff6e0, rgba(255, 150, 90, 0.7) 45%, rgba(120, 10, 0, 0.4));
    mix-blend-mode: screen;
  }
  #title canvas.embers { z-index: 2; opacity: 0; transition: opacity 2s ease; }
  #title > .sound, #prologue > .sound { position: absolute; top: 16px; right: 16px; z-index: 6; }

  /* The wordmark is text, in the CRT pixel font, so it can sit and scale anywhere. */
  .wordmark {
    margin: 0;
    font-family: "Press Start 2P", monospace;
    font-weight: normal;
    line-height: 1.25;
    color: var(--gold);
    text-transform: uppercase;
    text-shadow:
      0 0 10px rgba(255, 215, 0, 0.45),
      0 0 28px rgba(217, 119, 6, 0.35),
      3px 3px 0 #7a3d0a;
  }
  .wordmark .small { display: block; font-size: 0.45em; letter-spacing: 0.3em; color: var(--amber); }

  /* The big title: fire-red, slammed in with a strike of lightning. */
  #title .title-mark { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.1; text-shadow: none; }
  #title .title-mark .the {
    font-size: clamp(14px, 2.6vw, 34px); letter-spacing: 0.6em; margin-right: -0.6em;
    color: #e8a33a; margin-bottom: 0.9em;
    text-shadow: 0 0 10px rgba(255, 140, 30, 0.6);
  }
  #title .title-mark .name {
    font-size: clamp(26px, 7.4vw, 112px); white-space: nowrap;
    background: linear-gradient(#ffe6a0 0%, #ff8a2a 30%, #d42a1e 58%, #6e0905 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 60, 20, 0.55)) drop-shadow(0 0 42px rgba(170, 10, 0, 0.6)) drop-shadow(4px 4px 0 #2a0402);
  }
  #title .buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #title .hint { font-size: 22px; color: var(--parchment); text-align: center; text-shadow: 0 0 6px #000, 0 2px 4px #000, 0 0 14px #000; }
  #title .buttons, #title .hint, #title .sound { transition: opacity 1.2s ease; }

  /* Before the reveal, the title waits underneath the prologue with nothing showing. */
  #title.waiting .title-mark, #title.waiting .buttons, #title.waiting .hint, #title.waiting .sound { opacity: 0; pointer-events: none; }
  #title.slam:not(.ready) .buttons, #title.slam:not(.ready) .hint { opacity: 0; pointer-events: none; }
  #title.slam .title-mark { animation: slam 1.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
  #title.slam .title-mark .name { animation: smoulder 3.2s ease-in-out infinite 1.4s; }
  #title.slam .strike { animation: strike 1.1s ease-out both; }
  #title.slam canvas.embers { opacity: 1; }
  #title.shake { animation: shake 0.5s steps(2) 1; }
  @keyframes slam {
    0%   { opacity: 0; transform: scale(1.9); filter: blur(14px); }
    35%  { opacity: 1; transform: scale(0.97); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  @keyframes smoulder {
    50% { filter: drop-shadow(0 0 22px rgba(255, 90, 30, 0.8)) drop-shadow(0 0 70px rgba(200, 20, 0, 0.75)) drop-shadow(4px 4px 0 #2a0402); }
  }
  @keyframes strike { 0% { opacity: 1; } 12% { opacity: 0.2; } 20% { opacity: 0.85; } 100% { opacity: 0; } }
  @keyframes shake {
    0%, 100% { transform: none; }
    20% { transform: translate(-7px, 4px); } 40% { transform: translate(6px, -5px); }
    60% { transform: translate(-4px, -3px); } 80% { transform: translate(3px, 4px); }
  }

  /* The prologue sits on top of the waiting title, and fades away to reveal it. */
  #prologue {
    position: fixed; inset: 0; z-index: 11;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px; overflow: hidden auto;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0.55), rgba(0,0,0,0.92)),
      #050605 url("/assets/images/bg.png") center / cover no-repeat;
    transition: opacity 0.35s ease;
    cursor: pointer;
  }
  #prologue[hidden] { display: none; }
  #prologue.gone { opacity: 0; pointer-events: none; }
  #prologue .gate {
    margin: auto 0; font-family: "Press Start 2P", monospace; font-size: 12px;
    color: var(--amber); text-align: center; animation: pulse 2.4s ease-in-out infinite;
  }
  #prologue .gate[hidden] { display: none; }
  #prologue .story { margin: auto 0; max-width: 44rem; width: 100%; transition: opacity 1.6s ease; }
  #prologue .story[hidden] { display: none; }
  #prologue.reveal .story { opacity: 0; }
  #prologue p {
    margin: 0 0 0.75em;
    font-size: clamp(18px, min(2.6vw, 2.9vh), 30px);   /* fit the whole crawl on one screen */
    line-height: 1.2;
    text-align: center;
    color: var(--parchment);
    text-shadow: 0 0 6px #000, 0 2px 4px #000, 0 0 14px #000;
    opacity: 0; transform: translateY(6px);
    transition: opacity 1.8s ease, transform 1.8s ease;
  }
  #prologue p.shown { opacity: 1; transform: none; }
  #prologue .skip {
    position: absolute; right: 16px; bottom: 14px;
    font-family: "Press Start 2P", monospace; font-size: 9px; color: var(--dim);
    opacity: 0; transition: opacity 1s;
  }
  #prologue.crawling .skip { opacity: 0.6; }
  #prologue.reveal .skip { opacity: 0; }
  #prologue .blackout {
    position: absolute; inset: 0; background: #000; opacity: 0;
    transition: opacity 1.6s ease; pointer-events: none; z-index: 1;
  }
  #prologue.reveal .blackout { opacity: 1; }
  @keyframes pulse { 50% { opacity: 0.45; } }

  @media (prefers-reduced-motion: reduce) {
    #prologue p, #prologue .story, #prologue .blackout { transition: none; transform: none; }
    #prologue .gate, #title.slam .title-mark .name, #title.shake, #title.slam .strike { animation: none; }
    #title.slam .title-mark { animation: none; opacity: 1; }
  }

  /* ---------- layout ---------- */
  #app {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 12px;
    padding: 12px 16px 16px;
    max-width: 1280px;
    margin: 0 auto;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header .wordmark { font-size: 16px; text-shadow: 0 0 8px rgba(255, 215, 0, 0.4), 2px 2px 0 #7a3d0a; }
  header .wordmark .small { display: inline; font-size: 1em; letter-spacing: normal; color: var(--gold); }
  header .controls { display: flex; gap: 8px; }

  main {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 16px;
  }

  /* ---------- CRT terminal ---------- */
  .crt {
    position: relative;
    min-height: 0;
    display: flex; flex-direction: column;
    background: var(--ink);
    border: 3px solid var(--bronze);
    outline: 6px solid var(--wood);
    border-radius: 14px;
    box-shadow: inset 0 0 60px rgba(255, 190, 90, 0.08), 0 10px 40px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  .crt::before {            /* scanlines */
    content: "";
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.22) 50%);
    background-size: 100% 4px;
    pointer-events: none;
  }
  .crt::after {             /* flicker */
    content: "";
    position: absolute; inset: 0; z-index: 2;
    background: rgba(18,16,16,0.06);
    animation: flicker 0.15s infinite;
    pointer-events: none;
  }
  @keyframes flicker { 0% { opacity: 0.4; } 50% { opacity: 0.8; } 100% { opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) { .crt::after { animation: none; } }

  .crt-status {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 14px 36px 12px;
    border-bottom: 1px solid rgba(153, 102, 51, 0.4);
    font-family: "Press Start 2P", monospace; font-size: 10px; line-height: 1.6;
    color: var(--gold);
  }
  .crt-status #status-phase { color: var(--dim); white-space: nowrap; }

  #log {
    position: relative;
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 26px 36px 0;
    text-shadow: 0 0 6px rgba(242, 230, 207, 0.25);
    scrollbar-color: var(--bronze) transparent;
  }

  /* Each response is a block. The newest is large and fills the screen;
     older ones shrink and fade above it. Sizes are in em so that works. */
  .block { font-size: 28px; line-height: 1.3; padding-bottom: 28px; transition: opacity 0.5s; }
  .block.past { font-size: 18px; opacity: 0.38; padding-bottom: 18px; }
  .block.past:hover { opacity: 0.7; }
  .block p { margin: 0 0 0.6em; white-space: pre-wrap; }

  .cmd { color: var(--gold); font-size: 0.72em; margin-bottom: 0.9em; opacity: 0.85; }
  .cmd::before { content: "> "; }
  .system { color: var(--dim); font-style: italic; font-size: 0.75em; }
  .event { color: var(--amber); }

  .scene-name {
    font-family: "Press Start 2P", monospace;
    font-size: 0.78em; line-height: 1.5;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.35);
    margin: 0.2em 0 0.8em !important;
  }
  .scene-desc { font-size: 1.05em; }
  .scene-atmos { color: #e9c98a; font-style: italic; }
  .memory {
    font-size: 0.88em; font-style: italic;
    color: #dccba6;
    border-left: 3px solid var(--bronze);
    background: rgba(153, 102, 51, 0.1);
    padding: 0.25em 0 0.25em 0.6em;
  }
  .presence.person { color: #a6d8cb; }
  .presence.danger { color: #ff8f78; }
  .presence.item { color: var(--amber); }

  .exits { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 0.8em; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  .exits.shown { opacity: 1; pointer-events: auto; }
  .block.past .exits { display: none; }
  .exit {
    font-family: "VT323", monospace; font-size: 0.75em;
    color: var(--parchment);
    background: rgba(74, 53, 32, 0.55);
    border: 1px solid var(--bronze);
    box-shadow: none;
    padding: 6px 12px;
  }
  .exit b { font-family: "Press Start 2P", monospace; font-size: 10px; color: var(--gold); margin-right: 8px; }
  .exit:hover { background: rgba(153, 102, 51, 0.5); }

  .typing::after { content: "▌"; color: var(--gold); animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  form.prompt {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 22px 16px;
    border-top: 1px solid rgba(153, 102, 51, 0.4);
    font-size: 24px;
  }
  form.prompt span { color: var(--gold); }
  #input {
    flex: 1;
    background: transparent; border: none; outline: none;
    color: var(--parchment);
    font: inherit;
    caret-color: var(--gold);
  }
  #input:disabled { opacity: 0.5; }

  /* ---------- sidebar ---------- */
  aside { min-height: 0; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .panel {
    background: var(--panel);
    border: 2px solid var(--bronze);
    outline: 4px solid var(--wood);
    padding: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  .panel h2 {
    margin: 0 0 12px;
    font-family: "Press Start 2P", monospace;
    font-size: 10px; letter-spacing: 1px;
    color: var(--gold);
  }

  .map-wrap { position: relative; }
  #map {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 2px;
    aspect-ratio: 1;
    background: #050505;
    padding: 2px;
  }
  .cell {
    position: relative;
    background: #0d0d0d;
    display: flex; align-items: center; justify-content: center;
    font-family: "Press Start 2P", monospace; font-size: 9px;
  }
  .cell.unknown { background: #0d0d0d radial-gradient(circle, #1b1b1b 1px, transparent 1px) center / 6px 6px; }
  .cell.woods { background: var(--woods); }
  .cell.meadow { background: var(--meadow); }
  .cell.highlands { background: var(--highlands); }
  .cell.crystal { background: var(--crystal); }
  .cell.ruins { background: var(--ruins); }
  .cell.twilight { background: var(--twilight); }
  .cell.blight { background: var(--blight); }
  .cell.marked::after { content: "★"; color: var(--gold); font-size: 13px; text-shadow: 0 0 4px #000; font-family: sans-serif; }
  .cell.here { outline: 2px solid var(--gold); outline-offset: -2px; z-index: 1; animation: pulse 1.6s ease-in-out infinite; }
  .cell.here::after { content: "@"; color: #fff8d6; font-size: 10px; text-shadow: 0 0 6px var(--gold); font-family: "Press Start 2P", monospace; }
  @keyframes pulse { 50% { box-shadow: 0 0 12px var(--gold); } }

  .tint { position: absolute; inset: 0; pointer-events: none; transition: background 1.2s; }
  .phase-dawn .tint { background: rgba(255, 210, 170, 0.08); }
  .phase-day .tint { background: transparent; }
  .phase-dusk .tint { background: rgba(160, 70, 20, 0.22); }
  .phase-night .tint { background: rgba(5, 15, 55, 0.5); }

  #place { margin-top: 10px; font-size: 22px; color: var(--amber); min-height: 1.2em; }

  .time { display: flex; align-items: center; gap: 12px; font-size: 24px; }
  .time .icon { font-size: 26px; width: 30px; text-align: center; }
  .segments { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 10px; }
  .segments div { height: 8px; background: #2a2118; border: 1px solid #3d2f1f; position: relative; overflow: hidden; }
  .segments div span { position: absolute; inset: 0 auto 0 0; background: var(--amber); }
  .segments div.past span { width: 100%; opacity: 0.35; }

  .bar { height: 14px; background: #2a1414; border: 1px solid #5a2a2a; margin-top: 8px; }
  .bar > div { height: 100%; background: linear-gradient(#e0b23a, #b4730f); transition: width 0.4s; }
  .bar.low > div { background: linear-gradient(#e2533f, #8d1f14); }
  .health-row { display: flex; justify-content: space-between; font-size: 22px; }

  #inventory { list-style: none; padding: 0; margin: 0; font-size: 22px; }
  #inventory li { padding-left: 1.1em; }
  #inventory li.quest { padding-left: 0; }
  #inventory li.quest::before { content: "◆ "; color: var(--gold); }   /* only quest items get a diamond */
  #inventory li.new { animation: found 2.4s ease-out; }
  @keyframes found {
    0%, 20% { color: var(--gold); text-shadow: 0 0 10px var(--gold), 0 0 22px var(--amber-deep); }
    100% { color: inherit; text-shadow: none; }
  }
  #inventory .empty { color: var(--dim); }
  #inventory .empty::before { content: ""; }

  /* ---------- small screens ---------- */
  @media (max-width: 860px) {
    body { overflow: auto; }
    #app { height: auto; min-height: 100%; }
    #app { padding: 10px 16px 16px; }
    main { grid-template-columns: minmax(0, 1fr); }
    .crt { outline-width: 3px; }
    .panel { outline-width: 2px; }
    header button { padding: 8px 10px; font-size: 9px; }
    .crt { height: 70vh; }
    aside { overflow: visible; }
    header .wordmark { font-size: 12px; }
    #log { padding: 16px 18px 0; }
    .crt-status { padding: 12px 18px 10px; }
    .block { font-size: 22px; }
    .block.past { font-size: 16px; }
    form.prompt { padding: 10px 16px 14px; }
  }
</style>
</head>
<body>

<div id="title" class="waiting">
  <canvas class="fx" id="rain" aria-hidden="true"></canvas>
  <canvas class="fx" id="bolt" aria-hidden="true"></canvas>
  <canvas class="fx embers" id="embers" aria-hidden="true"></canvas>
  <div class="fx flash" id="flash" aria-hidden="true"></div>
  <div class="fx strike" aria-hidden="true"></div>
  <button class="music-toggle sound" title="Music">♪ Off</button>
  <h1 class="wordmark title-mark"><span class="the">The</span><span class="name">Last Centaur</span></h1>
  <div class="buttons">
    <button id="continue" class="primary" hidden>Continue</button>
    <button id="begin" class="primary">Begin</button>
    <button id="title-new" hidden>New game</button>
  </div>
  <div class="hint" id="title-hint"></div>
</div>

<div id="prologue">
  <button class="music-toggle sound" title="Music">♪ Off</button>
  <div class="blackout" aria-hidden="true"></div>
  <div class="gate" id="gate">Press any key</div>
  <div class="story" id="prologue-story" aria-live="polite" hidden></div>
  <div class="skip">Enter to skip</div>
</div>

<div id="app">
  <header>
    <div class="wordmark"><span class="small">The </span>Last Centaur</div>
    <div class="controls">
      <button class="music-toggle" title="Music">♪ Off</button>
      <button id="new">New game</button>
    </div>
  </header>

  <main>
    <section class="crt" id="crt">
      <div class="crt-status"><span id="status-place"></span><span id="status-phase"></span></div>
      <div id="log" aria-live="polite"></div>
      <form class="prompt" id="prompt" autocomplete="off">
        <span>&gt;</span>
        <input id="input" spellcheck="false" aria-label="What do you do?" placeholder="" />
      </form>
    </section>

    <aside>
      <div class="panel">
        <h2>THE LAND</h2>
        <div class="map-wrap" id="map-wrap">
          <div id="map"></div>
          <div class="tint"></div>
        </div>
        <div id="place"></div>
      </div>

      <div class="panel">
        <h2>THE HOUR</h2>
        <div class="time"><span class="icon" id="phase-icon"></span><span id="phase-name"></span></div>
        <div class="segments" id="segments"></div>
      </div>

      <div class="panel">
        <h2>STRENGTH</h2>
        <div class="health-row"><span>Health</span><span id="health-text"></span></div>
        <div class="bar" id="health-bar"><div></div></div>
      </div>

      <div class="panel">
        <h2>CARRIED</h2>
        <ul id="inventory"></ul>
      </div>
    </aside>
  </main>
</div>

<audio id="theme" src="/assets/audio/tlfc.mp3" loop preload="auto"></audio>
<!-- Music for the prologue crawl. Drop a track at this path; until then the prologue is silent. -->
<audio id="prologue-music" src="/assets/audio/prologue.mp3" loop preload="auto"></audio>

<script>
  const $ = (id) => document.getElementById(id);
  const PHASES = ["dawn", "day", "dusk", "night"];
  const PHASE_ICONS = { dawn: "◐", day: "☀", dusk: "◑", night: "☾" };

  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  };

  let history = store.get("history", []);
  let historyIndex = history.length;
  let busy = false;
  let initial = null;

  async function api(path, body) {
    const options = body === undefined ? {} : {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    };
    const response = await fetch(path, options);
    if (!response.ok) throw new Error(`Server error ${response.status}`);
    return response.json();
  }

  // ---------------- log ----------------

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CHARS_PER_FRAME = 2;
  let typing = null;  // the block currently typing out, if any

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // Build a block from its parts. Text elements start empty and are typed out.
  function buildBlock({ command, system, before, scene, after }) {
    const block = el("div", "block current");
    const segments = [];
    const typed = (tag, className, text) => {
      if (!text) return;
      const node = el(tag, className, "");
      node.hidden = true;            // revealed when the typing reaches it
      block.appendChild(node);
      segments.push({ node, text });
    };

    if (command) block.appendChild(el("div", "cmd", command));
    typed("p", "system", system);
    typed("p", "", before);
    let exits = null;
    if (scene) {
      typed("p", "scene-name", scene.name);
      typed("p", "scene-desc", scene.description);
      typed("p", "scene-atmos", scene.atmosphere.join(" "));
      scene.memories.forEach((m) => typed("p", "memory", m));
      scene.presence.forEach(([kind, line]) => typed("p", `presence ${kind}`, line));
      exits = el("div", "exits");
      for (const exit of scene.exits) {
        const button = el("button", "exit");
        button.type = "button";
        button.append(el("b", "", exit.direction[0].toUpperCase()), exit.name);
        button.title = `Go ${exit.direction}`;
        button.addEventListener("click", (e) => { e.stopPropagation(); runCommand(exit.direction[0]); });
        exits.appendChild(button);
      }
      block.appendChild(exits);
    }
    (after || "").split(/\n\s*\n/).forEach((chunk) => typed("p", "event", chunk.trim()));
    return { block, segments, exits };
  }

  function addBlock(parts) {
    finishTyping();
    const log = $("log");
    for (const old of log.querySelectorAll(".block.current")) {
      old.classList.replace("current", "past");
      old.style.minHeight = "";
    }
    const { block, segments, exits } = buildBlock(parts);
    log.appendChild(block);
    while (log.children.length > 200) log.removeChild(log.firstChild);
    block.style.minHeight = `${log.clientHeight - 26}px`;   // so the newest block can fill the screen
    log.scrollTo({ top: block.offsetTop - 18, behavior: reduceMotion ? "auto" : "smooth" });
    typeOut(segments, exits);
  }

  function typeOut(segments, exits) {
    const state = { segments, exits, index: 0, chars: 0, done: false };
    typing = state;
    const finish = () => {
      for (const { node, text } of segments) { node.hidden = false; node.textContent = text; node.classList.remove("typing"); }
      if (exits) exits.classList.add("shown");
      state.done = true;
      if (typing === state) typing = null;
    };
    state.finish = finish;
    if (reduceMotion) return finish();

    const step = () => {
      if (state.done) return;
      const seg = segments[state.index];
      if (!seg) return finish();
      seg.node.hidden = false;
      seg.node.classList.add("typing");
      state.chars += CHARS_PER_FRAME;
      seg.node.textContent = seg.text.slice(0, state.chars);
      if (state.chars >= seg.text.length) {
        seg.node.classList.remove("typing");
        state.index += 1;
        state.chars = 0;
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function finishTyping() { if (typing) typing.finish(); }

  function clearLog() { finishTyping(); $("log").innerHTML = ""; }

  // ---------------- sidebar ----------------

  function render(state) {
    const map = $("map");
    map.innerHTML = "";
    for (const row of state.map) {
      for (const cell of row) {
        const div = document.createElement("div");
        const classes = ["cell", cell.known ? cell.biome : "unknown"];
        if (cell.marked) classes.push("marked");
        if (cell.here) classes.push("here");
        div.className = classes.join(" ");
        div.title = cell.name || (cell.marked ? "A place someone marked" : cell.known ? "Somewhere you haven't been" : "");
        map.appendChild(div);
      }
    }
    $("map-wrap").className = `map-wrap phase-${state.phase}`;
    $("place").textContent = state.place;
    $("status-place").textContent = state.place;
    $("status-phase").textContent = `${PHASE_ICONS[state.phase]} ${state.phase.toUpperCase()}`;

    $("phase-icon").textContent = PHASE_ICONS[state.phase];
    $("phase-name").textContent = state.phase[0].toUpperCase() + state.phase.slice(1);
    const segments = $("segments");
    segments.innerHTML = "";
    PHASES.forEach((phase, i) => {
      const seg = document.createElement("div");
      seg.title = phase;
      const fill = document.createElement("span");
      if (i < state.phase_index) seg.className = "past";
      if (i === state.phase_index) fill.style.width = `${Math.max(8, state.phase_progress * 100)}%`;
      seg.appendChild(fill);
      segments.appendChild(seg);
    });

    const pct = Math.max(0, Math.min(100, (state.health / state.max_health) * 100));
    $("health-text").textContent = `${state.health} / ${state.max_health}`;
    $("health-bar").firstElementChild.style.width = `${pct}%`;
    $("health-bar").classList.toggle("low", pct <= 35);

    const inv = $("inventory");
    inv.innerHTML = "";
    if (!state.inventory.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing.";
      inv.appendChild(li);
    }
    const gained = lastInventory ? state.inventory.filter((i) => !lastInventory.includes(i.name)) : [];
    for (const item of state.inventory) {
      const li = document.createElement("li");
      li.textContent = item.name;
      if (item.quest) li.classList.add("quest");
      if (gained.includes(item)) li.classList.add("new");
      inv.appendChild(li);
    }
    if (gained.some((i) => i.quest)) ding();
    lastInventory = state.inventory.map((i) => i.name);
  }

  // ---------------- sound effects ----------------

  let lastInventory = null;   // null until the first render, so loading a save doesn't chime
  let audioCtx = null;

  // A bright two-note chime for finding a quest item, synthesized (no sound file).
  function ding() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const master = audioCtx.createGain();
      master.gain.value = 0.22;
      master.connect(audioCtx.destination);
      // E6 then A6, each built from bell-like partials that fade at different rates
      for (const [freq, delay] of [[1318.5, 0], [1760, 0.11]]) {
        [[1, 1, 1.4], [2.76, 0.32, 0.6], [5.4, 0.1, 0.3]].forEach(([ratio, peak, length]) => {
          const t = now + delay;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq * ratio;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(peak, t + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + length);
          osc.connect(gain);
          gain.connect(master);
          osc.start(t);
          osc.stop(t + length + 0.05);
        });
      }
    } catch {}  // no audio available: the glow still shows it
  }
  window.ding = ding;          // try it from the console

  // ---------------- music ----------------

  // One track plays at a time: the prologue's while it runs, the theme from the title on.
  const TRACKS = { prologue: $("prologue-music"), theme: $("theme") };
  const VOLUME = 0.35;
  let track = "theme";
  const fades = new Map();
  const musicOn = () => store.get("music", true);

  function fadeTo(audio, volume, ms, then) {
    clearInterval(fades.get(audio));
    const from = audio.volume, start = performance.now();
    fades.set(audio, setInterval(() => {
      const k = Math.min(1, (performance.now() - start) / ms);
      audio.volume = from + (volume - from) * k;
      if (k === 1) { clearInterval(fades.get(audio)); if (then) then(); }
    }, 40));
  }

  function setMusic(on) {
    store.set("music", on);
    for (const button of document.querySelectorAll(".music-toggle")) button.textContent = on ? "♪ On" : "♪ Off";
    const audio = TRACKS[track];
    if (on) { clearInterval(fades.get(audio)); audio.volume = VOLUME; audio.play().catch(() => {}); }
    else Object.values(TRACKS).forEach((a) => a.pause());
  }

  // Crossfade to another track, from its beginning.
  function switchTrack(name, ms = 1200) {
    if (name === track) { if (musicOn() && TRACKS[track].paused) setMusic(true); return; }
    const old = TRACKS[track];
    track = name;
    fadeTo(old, 0, ms, () => old.pause());
    if (!musicOn()) return;
    const audio = TRACKS[name];
    audio.currentTime = 0;
    audio.volume = 0;
    audio.play().catch(() => {});
    fadeTo(audio, VOLUME, ms);
  }

  for (const button of document.querySelectorAll(".music-toggle")) {
    button.addEventListener("click", (event) => { event.stopPropagation(); setMusic(!musicOn()); });
  }

  // Browsers block sound until the visitor interacts with the page. Try right
  // away; if that's blocked, start on the first click or keypress instead.
  function startMusicOnFirstInteraction(event) {
    if (event.target.closest && event.target.closest(".music-toggle")) return;  // the toggle handles itself
    removeEventListener("pointerdown", startMusicOnFirstInteraction, true);
    removeEventListener("keydown", startMusicOnFirstInteraction, true);
    if (musicOn() && TRACKS[track].paused) setMusic(true);
  }
  addEventListener("pointerdown", startMusicOnFirstInteraction, true);
  addEventListener("keydown", startMusicOnFirstInteraction, true);

  // ---------------- weather (title screen) ----------------

  const weather = (() => {
    const SCALE = 2;                       // draw at half resolution, so pixels read as pixels
    const rain = $("rain"), bolt = $("bolt"), flash = $("flash");
    const rainCtx = rain.getContext("2d"), boltCtx = bolt.getContext("2d");
    let drops = [], frame = null, timer = null, w = 0, h = 0;

    function newDrop(anywhere) {
      const depth = Math.random();         // 0 = far away, 1 = close
      return {
        x: Math.random() * (w + 80) - 40,
        y: anywhere ? Math.random() * h : -Math.random() * h * 0.3,
        len: 4 + depth * 9,
        speed: 4 + depth * 6,
        alpha: 0.12 + depth * 0.33,
      };
    }

    function resize() {
      w = Math.ceil(innerWidth / SCALE);
      h = Math.ceil(innerHeight / SCALE);
      for (const canvas of [rain, bolt]) { canvas.width = w; canvas.height = h; }
      const density = reduceMotion ? 2600 : 900;
      drops = Array.from({ length: Math.round((w * h) / density) }, () => newDrop(true));
    }

    function tick() {
      rainCtx.clearRect(0, 0, w, h);
      rainCtx.lineWidth = 1;
      for (const d of drops) {
        const speed = reduceMotion ? d.speed * 0.5 : d.speed;
        d.y += speed;
        d.x += speed * 0.18;
        if (d.y - d.len > h) Object.assign(d, newDrop(false));
        rainCtx.strokeStyle = `rgba(185, 215, 225, ${d.alpha})`;
        rainCtx.beginPath();
        rainCtx.moveTo(Math.round(d.x), Math.round(d.y));
        rainCtx.lineTo(Math.round(d.x - d.len * 0.18), Math.round(d.y - d.len));
        rainCtx.stroke();
      }
      frame = requestAnimationFrame(tick);
    }

    function drawBolt() {
      boltCtx.clearRect(0, 0, w, h);
      if (Math.random() < 0.35) return;    // sometimes it's only sheet lightning in the clouds
      // strike in the left or right part of the sky, so bolts frame the title rather than cross it
      const side = Math.random() < 0.5 ? 0.06 : 0.7;
      let x = w * (side + Math.random() * 0.24), y = 0;
      const end = h * (0.2 + Math.random() * 0.14);   // stay in the sky, above the title
      const branches = [];
      boltCtx.strokeStyle = "#f4fbff";
      boltCtx.shadowColor = "rgba(190, 230, 255, 0.9)";
      boltCtx.shadowBlur = 8;
      boltCtx.lineWidth = 2;
      boltCtx.beginPath();
      boltCtx.moveTo(x, y);
      while (y < end) {
        y += 4 + Math.random() * 8;
        x += (Math.random() - 0.5) * 12;
        boltCtx.lineTo(Math.round(x), Math.round(y));
        if (Math.random() < 0.12) branches.push([x, y]);
      }
      boltCtx.stroke();
      boltCtx.lineWidth = 1;
      for (let [bx, by] of branches) {
        const dir = Math.random() < 0.5 ? -1 : 1;
        boltCtx.beginPath();
        boltCtx.moveTo(bx, by);
        for (let i = 0, n = 4 + Math.random() * 5; i < n; i++) {
          by += 3 + Math.random() * 6;
          bx += dir * (2 + Math.random() * 6);
          boltCtx.lineTo(Math.round(bx), Math.round(by));
        }
        boltCtx.stroke();
      }
    }

    // One strike is at most two pulses, well under the 3-flashes-a-second safety limit.
    function strike() {
      if (reduceMotion) return;
      drawBolt();
      flash.animate(
        [{ opacity: 0 }, { opacity: 0.55, offset: 0.06 }, { opacity: 0.08, offset: 0.18 },
         { opacity: 0.35, offset: 0.3 }, { opacity: 0 }],
        { duration: 1000, easing: "ease-out" },
      );
      bolt.animate([{ opacity: 1 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { duration: 750 });
    }

    function schedule(delay) {
      timer = setTimeout(() => { strike(); schedule(6000 + Math.random() * 9000); }, delay);
    }

    function start() {
      resize();
      if (!frame) tick();
      if (!timer && !reduceMotion) schedule(2500);
    }

    function stop() {
      cancelAnimationFrame(frame);
      clearTimeout(timer);
      frame = timer = null;
    }

    addEventListener("resize", () => { if (frame) resize(); });
    return { start, stop, strike };
  })();
  window.lightning = weather.strike;       // handy from the console when tuning

  // ---------------- starting ----------------

  function enter(state, { showIntro }) {
    opening.leave();
    clearLog();
    const intro = showIntro && state.intro
      ? state.intro.replace(/^THE LAST CENTAUR\s*/, "").replace(/\n*\(Type what.*\)\s*$/s, "").trim()
      : "";
    addBlock({
      system: showIntro ? "" : "(You return to where you left off.)",
      before: intro,
      scene: state.scene,
    });
    render(state);
    switchTrack("theme");
    $("input").focus();
  }

  // The opening. The prologue crawls over the background (after a "press any key",
  // which lets the music start), then the screen goes black, lightning strikes and
  // the title slams in. The title is the start screen: its buttons appear beneath it.
  // During the crawl, Enter (or a click) skips straight to the title.
  const opening = (() => {
    const screen = $("prologue"), story = $("prologue-story"), gate = $("gate"), title = $("title");
    let stage = "idle";                    // gate -> crawl -> reveal -> title -> idle
    let timers = [], lines = [], stopEmbers = () => {};
    const later = (ms, fn) => timers.push(setTimeout(fn, ms));
    const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

    function show(paragraphs, { gated }) {
      clearTimers();
      stopEmbers();
      document.activeElement?.blur();
      title.className = "waiting";
      screen.className = "";
      screen.hidden = false;
      story.innerHTML = "";
      lines = (paragraphs || []).map((text) => story.appendChild(el("p", "", text)));
      track = "prologue";                  // so the first keypress starts the prologue's music
      if (!lines.length) return slam();
      stage = "gate";
      gate.hidden = !gated;
      story.hidden = gated;
      if (!gated) crawl();
    }

    function crawl() {
      stage = "crawl";
      gate.hidden = true;
      story.hidden = false;
      screen.classList.add("crawling");
      switchTrack("prologue");
      if (reduceMotion) { lines.forEach((p) => p.classList.add("shown")); return; }
      let at = 600;
      lines.forEach((p) => {
        later(at, () => {
          p.classList.add("shown");
          p.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
        at += 1400 + p.textContent.length * 38;   // time to read it before the next one
      });
      later(at + 900, () => reveal(1900));     // hold on "You are...", then black, then the title
    }

    function reveal(delay) {
      if (stage !== "crawl") return;
      stage = "reveal";
      clearTimers();
      lines.forEach((p) => p.classList.add("shown"));
      screen.classList.add("reveal");
      fadeTo(TRACKS.prologue, 0, delay, () => TRACKS.prologue.pause());
      later(delay, slam);
    }

    function slam() {
      stage = "title";
      screen.classList.add("gone");
      later(400, () => { screen.hidden = true; });
      title.className = "slam shake";
      weather.start();
      weather.strike();
      boom();
      stopEmbers = embers($("embers"));
      switchTrack("theme", 300);
      later(600, () => title.classList.remove("shake"));
      later(1800, () => {
        title.classList.add("ready");
        const primary = [$("continue"), $("begin")].find((b) => !b.hidden);
        primary?.focus({ preventScroll: true });
      });
    }

    function leave() {
      stage = "idle";
      clearTimers();
      screen.hidden = true;
      title.classList.add("hidden");
      setTimeout(() => { stopEmbers(); weather.stop(); }, 700);   // after the title fades out
    }

    function advance() {
      if (stage === "gate") crawl();
      else if (stage === "crawl") reveal(900);
    }
    addEventListener("keydown", (event) => {
      if (stage === "gate" && !["Shift", "Control", "Alt", "Meta", "Tab"].includes(event.key)) {
        event.preventDefault(); advance();
      } else if (stage === "crawl" && ["Enter", " ", "Escape"].includes(event.key)) {
        event.preventDefault(); advance();
      }
    });
    screen.addEventListener("click", advance);

    return { show, leave };
  })();

  // A low, rolling boom for the title: a falling sub-bass thump under a burst of noise.
  function boom() {
    if (!musicOn()) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const master = audioCtx.createGain();
      master.gain.value = 0.5;
      master.connect(audioCtx.destination);

      const osc = audioCtx.createOscillator();
      const thump = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(90, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 1.6);
      thump.gain.setValueAtTime(0.0001, now);
      thump.gain.exponentialRampToValueAtTime(1, now + 0.02);
      thump.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
      osc.connect(thump); thump.connect(master);
      osc.start(now); osc.stop(now + 2.3);

      const length = Math.floor(audioCtx.sampleRate * 2.5);
      const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.5);
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.setValueAtTime(900, now);
      lowpass.frequency.exponentialRampToValueAtTime(120, now + 2);
      const rumble = audioCtx.createGain();
      rumble.gain.value = 0.55;
      noise.connect(lowpass); lowpass.connect(rumble); rumble.connect(master);
      noise.start(now);
    } catch {}  // no audio: the flash and shake still land
  }

  // Embers drifting up behind the title, drawn at quarter resolution for chunky pixels.
  function embers(canvas) {
    if (reduceMotion) return () => {};
    const ctx = canvas.getContext("2d");
    const scale = 4;
    let w, h, frame, running = true;
    const resize = () => {
      w = canvas.width = Math.ceil(innerWidth / scale);
      h = canvas.height = Math.ceil(innerHeight / scale);
    };
    resize();
    addEventListener("resize", resize);
    const spawn = (anywhere) => ({
      x: Math.random() * w,
      y: anywhere ? Math.random() * h : h + Math.random() * 10,
      speed: 0.12 + Math.random() * 0.35,
      drift: Math.random() * Math.PI * 2,
      life: 0.5 + Math.random() * 0.5,
    });
    const sparks = Array.from({ length: Math.round(w * h / 260) }, () => spawn(true));
    const tick = () => {
      if (!running) return;
      ctx.clearRect(0, 0, w, h);
      for (const s of sparks) {
        s.y -= s.speed;
        s.drift += 0.03;
        s.x += Math.sin(s.drift) * 0.15;
        if (s.y < -2) Object.assign(s, spawn(false));
        const fade = Math.min(1, s.y / (h * 0.6)) * s.life;
        ctx.fillStyle = `rgba(255, ${90 + Math.round(fade * 110)}, 40, ${fade.toFixed(2)})`;
        ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
      }
      frame = requestAnimationFrame(tick);
    };
    tick();
    return () => { running = false; cancelAnimationFrame(frame); removeEventListener("resize", resize); ctx.clearRect(0, 0, w, h); };
  }

  function setTitleButtons(state) {
    $("continue").hidden = state.fresh;
    $("begin").hidden = !state.fresh;
    $("title-new").hidden = state.fresh;
    $("title-hint").textContent = state.fresh ? "" : `You were at ${state.place}.`;
  }

  async function freshGame() {
    const state = await api("/api/new", {});
    lastInventory = null;
    history = []; historyIndex = 0; store.set("history", history);
    initial = state;
    setTitleButtons(state);
    return state;
  }

  $("begin").addEventListener("click", () => enter(initial, { showIntro: true }));
  $("continue").addEventListener("click", () => enter(initial, { showIntro: false }));

  // New game asks twice instead of using a browser dialog.
  function armNewGame(button, onConfirm) {
    let armed = false, timer;
    const label = button.textContent;
    button.addEventListener("click", () => {
      if (!armed) {
        armed = true;
        button.textContent = "Lose progress?";
        button.classList.add("warn");
        timer = setTimeout(() => { armed = false; button.textContent = label; button.classList.remove("warn"); }, 3000);
        return;
      }
      clearTimeout(timer);
      armed = false; button.textContent = label; button.classList.remove("warn");
      onConfirm();
    });
  }
  // From the title you've just seen the prologue, so a new game starts straight away.
  armNewGame($("title-new"), async () => enter(await freshGame(), { showIntro: true }));
  // From inside the game, a new game opens with the prologue again.
  armNewGame($("new"), async () => {
    const state = await freshGame();
    $("title").classList.remove("hidden");
    opening.show(state.prologue, { gated: false });
  });

  // ---------------- commands ----------------

  async function runCommand(text) {
    if (busy) return;
    if (text.toLowerCase() === "clear") { clearLog(); return; }
    const input = $("input");
    busy = true;
    input.disabled = true;
    try {
      const state = await api("/api/command", { text });
      addBlock({ command: text, ...state.block });
      render(state);
    } catch (err) {
      addBlock({ command: text, system: `(The connection to the world wavers: ${err.message}. Is the server still running?)` });
    } finally {
      busy = false;
      input.disabled = false;
      input.focus();
    }
  }

  $("prompt").addEventListener("submit", (event) => {
    event.preventDefault();
    const input = $("input");
    const text = input.value.trim();
    if (!text) { finishTyping(); return; }   // Enter on an empty line skips the typing
    if (busy) return;
    input.value = "";
    history.push(text);
    history = history.slice(-100);
    historyIndex = history.length;
    store.set("history", history);
    runCommand(text);
  });

  $("input").addEventListener("keydown", (event) => {
    if (event.key === "ArrowUp" && historyIndex > 0) {
      historyIndex -= 1;
      event.target.value = history[historyIndex];
      event.preventDefault();
    } else if (event.key === "ArrowDown") {
      historyIndex = Math.min(history.length, historyIndex + 1);
      event.target.value = history[historyIndex] || "";
      event.preventDefault();
    }
  });

  $("crt").addEventListener("click", () => {
    if (window.getSelection().toString()) return;
    finishTyping();
    $("input").focus();
  });

  document.addEventListener("keydown", (event) => {
    if (!typing) return;
    if (event.key === "Escape" || (event.key === " " && !$("input").value)) {
      event.preventDefault();
      finishTyping();
    }
  });

  // ---------------- boot ----------------

  api("/api/state").then((state) => {
    initial = state;
    setTitleButtons(state);
    if (location.hash === "#play") {      // skip the opening, straight into the game
      track = "theme";
      if (musicOn()) setMusic(true);       // may be blocked until the first click
      return enter(state, { showIntro: state.fresh });
    }
    for (const button of document.querySelectorAll(".music-toggle")) button.textContent = musicOn() ? "♪ On" : "♪ Off";
    opening.show(state.prologue, { gated: true });
  }).catch(() => {
    opening.show([], { gated: false });    // straight to the title, which says what's wrong
    $("continue").hidden = $("begin").hidden = true;
    $("title-hint").textContent = "Can't reach the game server. Start it with: python -m centaur.server";
  });
</script>
</body>
</html>
